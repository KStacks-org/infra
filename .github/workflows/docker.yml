name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      variant:
        description: Image tag prefix and build cache scope.
        type: string
        default: sha
      build-args:
        type: string
        default: ''
      artifact-name:
        type: string
        default: ''
      artifact-path:
        type: string
        default: .
    secrets:
      build-args:
        description: Additional build arguments that contain credentials.
        required: false
    outputs:
      image-tag:
        description: Published image tag.
        value: ${{ jobs.image.outputs.image-tag }}
      image-digest:
        description: Published image digest; empty for build-only PRs.
        value: ${{ jobs.image.outputs.image-digest }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: inputs.artifact-name != ''
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=${{ inputs.variant }}-,format=short
            type=semver,pattern={{version}},prefix=${{ inputs.variant != 'sha' && format('{0}-', inputs.variant) || '' }}

      - name: Build and publish
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ inputs.build-args }}
            ${{ secrets.build-args }}
          cache-from: type=gha,scope=${{ inputs.variant }}
          cache-to: type=gha,scope=${{ inputs.variant }},mode=max
