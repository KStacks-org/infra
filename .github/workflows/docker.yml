name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      variant:
        description: Explicit build environment for frontend variants.
        type: string
      build-args:
        type: string
        default: ''
      artifact-name:
        type: string
        default: ''
      artifact-path:
        type: string
        default: .
    secrets:
      build-secrets:
        description: Secrets mounted by BuildKit during image builds.
        required: false
    outputs:
      image-tag:
        description: Published image tag.
        value: ${{ jobs.image.outputs.image-tag }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE_ENV: ${{ inputs.variant || ((github.ref_name == 'dev' || github.base_ref == 'dev') && 'dev' || 'prod') }}
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')) }}
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: inputs.artifact-name != ''
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=${{ env.IMAGE_ENV == 'dev' && 'false' || 'auto' }}
          tags: |
            type=sha,prefix=${{ env.IMAGE_ENV }}-,format=short
            type=semver,pattern={{version}},prefix=${{ inputs.variant && format('{0}-', inputs.variant) || '' }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.build-secrets }}
          cache-from: type=gha,scope=${{ inputs.variant || 'sha' }}
          cache-to: type=gha,scope=${{ inputs.variant || 'sha' }},mode=max
