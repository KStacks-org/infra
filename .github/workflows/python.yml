name: Build Python service image

on:
  workflow_call:
    outputs:
      image-tag:
        description: Published service image tag.
        value: ${{ jobs.image.outputs.image-tag }}
      image-digest:
        description: Published service image digest.
        value: ${{ jobs.image.outputs.image-digest }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/docker.yml
