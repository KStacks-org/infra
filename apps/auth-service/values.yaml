replicaCount: 1
image:
  repository: ghcr.io/kstacks-org/auth-service
  tag: ''
route:
  gateway:
    name: kstacks-gateway
    namespace: default
  hostname: ''
config:
  SPRING_PROFILES_ACTIVE: prod
  APP_OAUTH2_HOSTED_DOMAIN: stu.kau.edu.sa
