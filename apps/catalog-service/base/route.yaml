apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-route
spec:
  parentRefs:
  - name: kstacks-gateway
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /catalog
    backendRefs:
    - name: catalog-service
      port: 80
