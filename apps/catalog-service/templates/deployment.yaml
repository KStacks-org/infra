apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 41619
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: catalog-config
            - secretRef:
                name: catalog-secret
          livenessProbe:
            httpGet:
              path: /catalog/actuator/health/liveness
              port: 41619
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /catalog/actuator/health/readiness
              port: 41619
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
