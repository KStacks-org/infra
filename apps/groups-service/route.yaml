apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: groups-route
  namespace: default
spec:
  parentRefs:
    - name: kstacks-gateway
  hostnames:
    - "api.kstacks.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /groups
      backendRefs:
        - name: groups-service
          port: 80
