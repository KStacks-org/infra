apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: groups-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /groups
      backendRefs:
        - name: groups-service
          port: 80
