apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: index-frontend-route
spec:
  parentRefs:
  - name: kstacks-gateway
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: index-frontend-service
      port: 80
