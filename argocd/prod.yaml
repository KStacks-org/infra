apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kstacks-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KStacks-org/infra.git
    targetRevision: master
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
