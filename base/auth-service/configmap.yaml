apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
data:
  DB_NAME: auth_db
  JWT_ACCESS_TOKEN_EXPIRATION: "300000" # 5 minutes
  JWT_REFRESH_TOKEN_EXPIRATION: "604800000" # 7 days
  JWT_ISSUER: kstack
  APP_OAUTH2_HOSTED_DOMAIN: stu.kau.edu.sa
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE: profile,email
  SERVER_FORWARD_HEADERS_STRATEGY: native
  SERVER_SERVLET_CONTEXT_PATH: /auth
  GENDERIZE_SERVICE_URL: http://genderize-service  
