apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planner-frontend-dev
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kstacks-org/infra.git
    targetRevision: master
    path: apps/planner-frontend/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
