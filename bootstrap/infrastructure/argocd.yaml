apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: https://github.com/kstacks-org/infra.git
    targetRevision: master
    path: infrastructure/argocd/chart
  - repoURL: https://github.com/kstacks-org/infra.git
    targetRevision: master
    path: infrastructure/argocd/resources
