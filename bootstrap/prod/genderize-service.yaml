apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genderize-service
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kstacks-org/infra.git
    targetRevision: master
    path: apps/genderize-service/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
