apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: infrastructure/envoy-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      jqPathExpressions:
        - '.spec.listeners[]?.tls?.certificateRefs[]?.group'
        - '.spec.listeners[]?.tls?.certificateRefs[]?.kind'
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      jqPathExpressions:
        - '.spec.jwt?.providers[]?.remoteJWKS?.cacheDuration'
    - group: gateway.envoyproxy.io
      kind: BackendTrafficPolicy
      jqPathExpressions:
        - '.spec.rateLimit?.global?.rules[]?.clientSelectors[]?.sourceCIDR?.invert'
        - '.spec.rateLimit?.global?.rules[]?.clientSelectors[]?.headers[]?.invert'
