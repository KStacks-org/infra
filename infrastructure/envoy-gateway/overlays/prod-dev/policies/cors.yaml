apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: cors
  namespace: dev
spec:
  mergeType: StrategicMerge
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: auth-route
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: catalog-route
  cors:
    allowOrigins:
    - https://dev.kstacks.org
    - https://groups.dev.kstacks.org
    allowCredentials: true
    allowMethods:
    - GET
    - POST
    - PATCH
    - DELETE
    - OPTIONS
    allowHeaders:
    - Content-Type
    - Authorization
