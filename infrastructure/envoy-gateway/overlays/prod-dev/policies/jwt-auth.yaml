apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: jwt-auth
  namespace: dev
spec:
  mergeType: StrategicMerge
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: groups-route
  jwt:
    providers:
    - name: auth-service-provider
      remoteJWKS:
        uri: http://auth-service.dev.svc.cluster.local/auth/.well-known/jwks.json
      extractFrom:
        headers:
        - name: Authorization
          valuePrefix: 'Bearer '
        cookies:
        - dev_access_token
      claimToHeaders:
      - claim: sub
        header: X-User-Id
      - claim: name
        header: X-User-Name
      - claim: email
        header: X-User-Email
      - claim: gender
        header: X-User-Gender
  cors:
    allowOrigins:
    - https://dev.kstacks.org
    - https://groups.dev.kstacks.org
    allowCredentials: true
    allowMethods:
    - GET
    - POST
    - PATCH
    - DELETE
    - OPTIONS
    allowHeaders:
    - Content-Type
    - Authorization
