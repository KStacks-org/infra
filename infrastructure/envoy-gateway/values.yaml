# Values for envoy-gateway
# Bootstrap supplies the enabled environments to this chart.
environments:
  prod:
    enabled: true
    namespace: default
  dev:
    enabled: false
    namespace: dev

devCorsOrigins:
  - https://dev.kstacks.org
  - https://groups.dev.kstacks.org

gateway:
  deployment:
    replicas: 1
  crds:
    enabled: false
  config:
    envoyGateway:
      rateLimit:
        backend:
          type: Redis
          redis:
            url: redis-master.redis.svc.cluster.local:6379
        failClosed: false

gateway-crds-helm:
  crds:
    gatewayAPI:
      enabled: true
    envoyGateway:
      enabled: true
