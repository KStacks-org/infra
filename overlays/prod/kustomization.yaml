apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
  - ../../base
  - gateway.yaml
  - cors.yaml
  - sealed-secrets/db-creds.yaml
  - sealed-secrets/auth-secret.yaml
  - sealed-secrets/catalog-secret.yaml
  - sealed-secrets/groups-secret.yaml
  - sealed-secrets/genderize-secret.yaml

# Argo CD Image Updater writes here. Tags are pinned, never :latest.
images:
  - name: ghcr.io/kstacks-org/auth-service
    newTag: prod-2da0e4c
  - name: ghcr.io/kstacks-org/catalog-service
    newTag: prod-af15ace
  - name: ghcr.io/kstacks-org/genderize-service
    newTag: production-877ec98
  - name: ghcr.io/kstacks-org/groups-service
    newTag: master-8dd4e46
  - name: ghcr.io/kstacks-org/groups-frontend
    newTag: master-ef2f134
  - name: ghcr.io/kstacks-org/portal-frontend
    newTag: master-ecf07c7

patches:
  - path: auth-config.yaml
  - target: {kind: HTTPRoute, name: auth-route}
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["api.kstacks.org"]
  - target: {kind: HTTPRoute, name: catalog-route}
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["api.kstacks.org"]
  - target: {kind: HTTPRoute, name: groups-route}
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["api.kstacks.org"]
  - target: {kind: HTTPRoute, name: groups-frontend-route}
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["groups.kstacks.org"]
  - target: {kind: HTTPRoute, name: portal-route}
    patch: |
      - op: add
        path: /spec/hostnames
        value: ["kstacks.org"]
