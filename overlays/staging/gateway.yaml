apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kstacks-gateway
  namespace: default
  annotations:
    # DNS-01 issuer: Sakhr has no public IP, so HTTP-01 cannot complete.
    cert-manager.io/cluster-issuer: "letsencrypt-dns01"
spec:
  gatewayClassName: eg
  listeners:
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.staging.kstacks.org"
      tls:
        mode: Terminate
        certificateRefs:
          - name: kstacks-staging-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: "staging.kstacks.org"
      tls:
        mode: Terminate
        certificateRefs:
          - name: kstacks-staging-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    - name: http-wildcard
      protocol: HTTP
      port: 80
      hostname: "*.staging.kstacks.org"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    - name: http-apex
      protocol: HTTP
      port: 80
      hostname: "staging.kstacks.org"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
