apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: cors
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: auth-route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: catalog-route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: groups-route
  cors:
    allowOrigins:
      - "https://kstacks.org"
      - "https://groups.kstacks.org"
    allowCredentials: true
    allowMethods: ["GET", "POST", "PATCH", "DELETE", "OPTIONS"]
    allowHeaders: ["Content-Type", "Authorization"]
